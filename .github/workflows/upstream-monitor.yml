name: Upstream Dependency Sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upstream-monitor.yml'
      - 'third_party/UPSTREAMS.json'
      - 'tools/refresh-upstream.ps1'
      - 'tools/refresh-minecraft-runtime-lock.ps1'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-dependency-sync
  cancel-in-progress: false

jobs:
  prepare:
    # Only this job can publish a review branch/PR/issue and dispatch Build.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      changed_ids: ${{ steps.refresh.outputs.changed_ids }}
      notify_ids: ${{ steps.refresh.outputs.notify_ids }}
      branch: ${{ steps.publish.outputs.branch }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Check for pending validated upstream update
        id: pending
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "[upstream] validated branch awaiting PR"
          $branch = "automation/upstream-sync"

          $issues = @(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number,title | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Unable to query pending upstream issues." }

          $issue = $issues | Where-Object { [string]$_.title -eq $title } | Select-Object -First 1
          if (-not $issue) {
            "blocked=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $remote = (git ls-remote --heads origin "refs/heads/$branch" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect pending upstream branch." }

          if ([string]::IsNullOrWhiteSpace($remote)) {
            gh issue close $issue.number --repo "${{ github.repository }}" --comment "The pending automation branch no longer exists; closing this stale checkpoint."
            if ($LASTEXITCODE -ne 0) { throw "Unable to close stale upstream checkpoint issue." }
            "blocked=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Warning "Validated upstream branch '$branch' is still awaiting a pull request/merge. Skipping a duplicate refresh run."
          "Pending validated upstream branch: `$branch` (issue #$($issue.number)). No duplicate branch will be generated." >> $env:GITHUB_STEP_SUMMARY
          "blocked=true" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Configure updater identity
        if: steps.pending.outputs.blocked != 'true'
        shell: pwsh
        run: |
          git config user.name "dlss-nr-manager-upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect, vendor and pin new upstream versions
        id: refresh
        if: steps.pending.outputs.blocked != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\refresh-upstream.ps1 -Apply -BumpPatchVersion
          if ($LASTEXITCODE -ne 0) { throw "Upstream refresh failed." }

      - name: Refresh Minecraft runtime lock
        if: steps.refresh.outputs.changed == 'true' && contains(steps.refresh.outputs.changed_ids, 'minecraft-')
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\refresh-minecraft-runtime-lock.ps1
          if ($LASTEXITCODE -ne 0) { throw "Minecraft runtime lock refresh failed." }
          git add -- third_party/minecraft/RUNTIME.lock.json

      - name: Validate refreshed vendored tree
        if: steps.refresh.outputs.changed == 'true'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-self-contained.ps1 -Strict -AllowLfsPointers
          if ($LASTEXITCODE -ne 0) { throw "Strict self-contained audit failed." }

      - name: Publish dependency branch and PR when permitted
        id: publish
        if: steps.refresh.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "automation/upstream-sync"
          $remote = (git ls-remote --heads origin "refs/heads/$branch" | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect existing automation branch." }

          $remoteSha = ""
          if (-not [string]::IsNullOrWhiteSpace(($remote | Out-String).Trim())) {
            $remoteSha = (($remote | Out-String).Trim() -split "\s+")[0]
          }

          git switch -C $branch
          if ($LASTEXITCODE -ne 0) { throw "Unable to create local automation branch." }
          git add -A

          if (-not (git status --porcelain)) {
            throw "Updater reported changes but the worktree is clean."
          }

          $ids = "${{ steps.refresh.outputs.changed_ids }}"
          $version = "${{ steps.refresh.outputs.app_version }}"
          git commit -m "deps: refresh validated upstream dependencies ($ids)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to commit refreshed upstream dependencies." }

          if ([string]::IsNullOrWhiteSpace($remoteSha)) {
            git push --set-upstream origin $branch
          }
          else {
            git push "--force-with-lease=refs/heads/${branch}:$remoteSha" --set-upstream origin $branch
          }
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish automation branch safely." }

          $body = @"
          Automated upstream synchronization.

          Updated dependencies: $ids
          Application version: $version

          Promotion policy:
          - immutable upstream commit SHA recorded
          - complete source snapshot vendored
          - restricted NVIDIA DLSS SDK remains notify-only
          - Windows/Linux refresh validation must pass
          - repository-required PR Build and CodeQL checks must pass
          - owner manually reviews and merges; workflow cannot auto-merge
          - production release consumes manager-owned assets only
          "@

          $pr = ""
          $prOutput = @(& gh pr create --base main --head $branch --title "deps: automated upstream refresh ($ids)" --body $body 2>&1)
          $prExit = $LASTEXITCODE

          if ($prExit -eq 0) {
            $pr = (gh pr view $branch --json number --jq ".number").Trim()
            if ([string]::IsNullOrWhiteSpace($pr)) { throw "Unable to resolve created PR number." }

            # Events emitted by GITHUB_TOKEN do not reliably trigger other workflows.
            # Dispatch Build explicitly so the protected-main required check is attached
            # to this exact automation branch SHA.
            gh workflow run build.yml --repo "${{ github.repository }}" --ref $branch
            if ($LASTEXITCODE -ne 0) { throw "Unable to dispatch required Build validation for automated PR #$pr." }
          }
          else {
            $message = ($prOutput | Out-String).Trim()
            if ($message -notmatch 'GitHub Actions is not permitted to create or approve pull requests') {
              throw "Failed to create upstream refresh PR: $message"
            }

            Write-Warning "Repository policy blocks PR creation by GITHUB_TOKEN. Validation will continue, but promotion will stop at a persistent validated branch + issue instead of attempting a forbidden push to main."
            "PR creation by GitHub Actions is disabled. The stable branch `$branch` will be validated and then recorded in a persistent issue; no direct push to protected `main` will be attempted." >> $env:GITHUB_STEP_SUMMARY
            $global:LASTEXITCODE = 0
          }

          "branch=$branch" >> $env:GITHUB_OUTPUT
          "pr_number=$pr" >> $env:GITHUB_OUTPUT

      - name: Record notify-only updates requiring manual review
        if: steps.refresh.outputs.notify_ids != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = "${{ steps.refresh.outputs.notify_ids }}"
          "Notify-only upstream updates requiring manual review: $ids" >> $env:GITHUB_STEP_SUMMARY

          $title = "[upstream] manual review update: $ids"
          $existing = gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($existing)) {
            $body = @"
          A newer upstream revision was detected for a dependency configured as notify-only.

          Dependency ids: $ids

          Notify-only means automatic promotion is intentionally disabled. The reason may be license restrictions, required local build inputs, model/runtime quality validation, or compatibility/regression testing. No production asset was changed automatically.

          Review the dependency's policy entry in third_party/UPSTREAMS.json, validate the required build/runtime/license conditions, then update the corresponding lock and manager-owned runtime through the normal protected PR path.
          "@
            gh issue create --repo "${{ github.repository }}" --title $title --body $body
            if ($LASTEXITCODE -ne 0) { throw "Unable to create notify-only upstream review issue." }
          }
          else {
            Write-Host "Notify-only upstream review issue #$existing is already open."
          }

  validate-windows:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          lfs: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Strict self-contained audit
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-self-contained.ps1 -Strict

      - name: Restore and test manager
        shell: pwsh
        run: |
          dotnet restore DlssNrManager.csproj
          dotnet restore tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj
          dotnet test tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true
          dotnet publish DlssNrManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -warnaserror -o publish-validation

      - name: Validate Real-ESRGAN build
        if: contains(needs.prepare.outputs.changed_ids, 'realesrgan')
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\build-realesrgan.ps1 -BuildPath build-realesrgan-validation -Clean

      - name: Validate OptiScaler build
        if: contains(needs.prepare.outputs.changed_ids, 'optiscaler')
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\build-optiscaler.ps1 -OutputDirectory build-optiscaler-validation -Clean

      - name: Validate ReShade build
        if: contains(needs.prepare.outputs.changed_ids, 'reshade')
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\build-reshade.ps1 -OutputDirectory build-reshade-validation -Clean

      - name: Validate Minecraft runtime bootstrap
        if: contains(needs.prepare.outputs.changed_ids, 'minecraft-')
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\bootstrap-minecraft-runtime.ps1 -NoUpload

  validate-linux:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          lfs: true

      - name: Validate FFmpeg build
        if: contains(needs.prepare.outputs.changed_ids, 'ffmpeg') || contains(needs.prepare.outputs.changed_ids, 'nv-codec-headers')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nasm pkg-config make zip xz-utils binutils-mingw-w64-x86-64
          bash ./tools/build-ffmpeg-windows.sh

      - name: No Linux-specific build required
        if: ${{ !(contains(needs.prepare.outputs.changed_ids, 'ffmpeg') || contains(needs.prepare.outputs.changed_ids, 'nv-codec-headers')) }}
        run: echo "No Linux-specific upstream validation required."

  promote:
    needs: [prepare, validate-windows, validate-linux]
    if: needs.prepare.outputs.changed == 'true'
    # The review reporting job MUST NOT have GitHub write permission to merge.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report validated dependency update for manual owner review
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ needs.prepare.outputs.pr_number }}"
          branch="${{ needs.prepare.outputs.branch }}"
          ids="${{ needs.prepare.outputs.changed_ids }}"

          if [ -n "$pr" ]; then
            # Passing CI is necessary, not sufficient for third-party approval.
            echo "::notice::Validated upstream PR #$pr awaits explicit owner review and manual squash merge."
            echo "Upstream dependency PR #$pr ($ids) is READY FOR OWNER REVIEW only; nothing was merged." >> "$GITHUB_STEP_SUMMARY"
            echo "Review pinned SHAs, source diffs, licensing and Build/CodeQL before manually merging via GitHub." >> "$GITHUB_STEP_SUMMARY"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          title="[upstream] validated branch awaiting PR"
          body_file="$RUNNER_TEMP/upstream-pending.md"
          cat > "$body_file" <<EOF
          A dependency update has passed the refresh-circuit validations but GitHub repository policy prevents \`GITHUB_TOKEN\` from creating the required pull request.

          Validated branch: \`$branch\`
          Updated dependencies: \`$ids\`
          Source workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Verified in this run:
          - upstream detection/vendorization completed
          - strict self-contained audit completed
          - Windows validation completed
          - Linux validation completed

          Protected-main policy remains intact. No direct push to \`main\` was attempted.

          Required action:
          1. Create a PR from \`$branch\` to \`main\`.
          2. Let the repository-required \`build\` check pass.
          3. Merge with squash.
          4. The main push will trigger Runtime Seed Refresh automatically.

          Automatic merging is intentionally disabled. The owner must review and manually merge a signed PR; granting Actions permission to create pull requests does not allow auto-promotion.
          EOF

          existing="$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "[upstream] validated branch awaiting PR") | .number' | head -n 1)"
          if [ -z "$existing" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$body_file"
          else
            gh issue edit "$existing" --repo "${{ github.repository }}" --body-file "$body_file"
          fi

          echo "::warning::Validated dependency branch is awaiting a protected-main pull request. See issue '$title'."
          echo "Validated branch \`$branch\` is intentionally left pending because Actions cannot create the required PR." >> "$GITHUB_STEP_SUMMARY"
          echo "promoted=false" >> "$GITHUB_OUTPUT"

