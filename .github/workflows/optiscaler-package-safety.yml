name: OptiScaler Deterministic Package Safety

on:
  pull_request:
    paths:
      - 'tools/build-optiscaler.ps1'
      - 'tools/create-deterministic-flat-zip.ps1'
      - 'tests/test_optiscaler_deterministic_zip.ps1'
      - '.github/workflows/optiscaler-package-safety.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build-optiscaler.ps1'
      - 'tools/create-deterministic-flat-zip.ps1'
      - 'tests/test_optiscaler_deterministic_zip.ps1'
      - '.github/workflows/optiscaler-package-safety.yml'

permissions:
  contents: read

jobs:
  deterministic-zip:
    name: Verify deterministic OptiScaler ZIP
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Verify Windows PowerShell 5.1 packaging
        shell: powershell
        run: |
          .\tests\test_optiscaler_deterministic_zip.ps1
