name: NuGet Offline Seed

on:
  push:
    branches: [ refactor/phase4-zero-upstream-production ]
    paths:
      - '.github/workflows/nuget-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Must match runtime-refresh.yml: both write nuget-offline.zip to runtime-seed-v1.
  group: runtime-seed-v1-writers
  cancel-in-progress: false

env:
  RUNTIME_SEED_TAG: runtime-seed-v1

jobs:
  vendor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build exact manager-owned offline NuGet feed
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\build-nuget-offline-seed.ps1
          if ($LASTEXITCODE -ne 0) { throw "NuGet seed generation failed." }

      - name: Publish manager-owned offline feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" --title "DLSS NR Manager Runtime Seed v1" --notes "Manager-owned bootstrap assets. This prerelease is not an application release." --prerelease
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 3
              gh release view $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Runtime seed release is unavailable." }
            }
          }

          # Append-only publish; retain canonical asset until validated promotion.
          & ./tools/publish-immutable-nuget-seed.ps1 -Path "build-local/nuget-offline.zip" -ReleaseTag $env:RUNTIME_SEED_TAG -Repository "${{ github.repository }}"
