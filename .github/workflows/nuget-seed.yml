name: NuGet Offline Seed

on:
  push:
    branches: [ refactor/phase4-zero-upstream-production ]
    paths:
      - '.github/workflows/nuget-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Must match runtime-refresh.yml: both write nuget-offline.zip to runtime-seed-v1.
  group: runtime-seed-v1-writers
  cancel-in-progress: false

env:
  RUNTIME_SEED_TAG: runtime-seed-v1

jobs:
  vendor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Build exact manager-owned offline NuGet feed
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\build-nuget-offline-seed.ps1
          if ($LASTEXITCODE -ne 0) { throw "NuGet seed generation failed." }

      - name: Publish manager-owned offline feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" --title "DLSS NR Manager Runtime Seed v1" --notes "Manager-owned bootstrap assets. This prerelease is not an application release." --prerelease
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 3
              gh release view $env:RUNTIME_SEED_TAG --repo "${{ github.repository }}" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Runtime seed release is unavailable." }
            }
          }

          # Skip an identical artifact: --clobber first removes the existing
          # release asset and creates a transient no-asset window for readers.
          $path = "build-local/nuget-offline.zip"
          $localHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $localSize = (Get-Item -LiteralPath $path).Length
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RUNTIME_SEED_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect runtime seed before publishing NuGet." }
          $asset = @($release.assets) | Where-Object { $_.name -eq "nuget-offline.zip" } | Select-Object -First 1
          if ($asset -and [long]$asset.size -eq [long]$localSize -and
              [string]$asset.digest -eq "sha256:$localHash") {
            Write-Host "SKIP unchanged NuGet seed ($localHash)."
          }
          else {
            if ($asset -and [string]::IsNullOrWhiteSpace([string]$asset.digest)) {
              throw "Existing NuGet asset has no GitHub digest; refusing unsafe clobber."
            }
            gh release upload $env:RUNTIME_SEED_TAG $path --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish manager-owned offline NuGet feed." }
            $updated = gh api "repos/${{ github.repository }}/releases/tags/$env:RUNTIME_SEED_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to verify NuGet seed after upload." }
            $uploaded = @($updated.assets) | Where-Object { $_.name -eq "nuget-offline.zip" } | Select-Object -First 1
            if (-not $uploaded -or [long]$uploaded.size -ne [long]$localSize -or
                [string]$uploaded.digest -ne "sha256:$localHash") {
              throw "Published NuGet seed failed exact size + GitHub SHA-256 verification."
            }
          }
