name: FFmpeg Runtime Seed Safety

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-refresh.yml'
      - '.github/workflows/ffmpeg-seed-safety.yml'
      - 'tools/publish-immutable-ffmpeg-seed.sh'
      - 'tests/test_immutable_ffmpeg_seed.py'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/runtime-refresh.yml'
      - '.github/workflows/ffmpeg-seed-safety.yml'
      - 'tools/publish-immutable-ffmpeg-seed.sh'
      - 'tests/test_immutable_ffmpeg_seed.py'

permissions:
  contents: read

jobs:
  verify:
    name: FFmpeg append-only publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate FFmpeg publisher shell syntax
        run: bash -n tools/publish-immutable-ffmpeg-seed.sh
      - name: Exercise FFmpeg publishing with mocked GitHub CLI
        run: python3 -m unittest discover -s tests -p 'test_immutable_ffmpeg_seed.py' -v
