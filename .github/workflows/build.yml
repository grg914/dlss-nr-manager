name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout manager repository without external action
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "+${{ github.ref }}:refs/remotes/ci/target"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch manager repository ref ${{ github.ref }}." }
          git checkout --detach refs/remotes/ci/target
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout manager repository ref." }

      - name: Verify pinned runner toolchain
        shell: pwsh
        run: |
          $dotnet = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $dotnet -notmatch "^8\.") {
            throw "A compatible preinstalled .NET 8 SDK is required. Resolved: '$dotnet'"
          }
          gh --version
          git --version
          git lfs version
          Write-Host "Using preinstalled .NET SDK $dotnet"

      - name: Materialize manager-owned offline NuGet feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $seed = "build-local/runtime-seed"
          $feed = "build-local/nuget-offline"
          New-Item -ItemType Directory -Force -Path $seed,$feed | Out-Null

          gh release download runtime-seed-v1 --repo "${{ github.repository }}" --pattern "nuget-offline.zip" --dir $seed --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to download manager-owned NuGet seed." }

          $zip = Join-Path $seed "nuget-offline.zip"
          if (!(Test-Path -LiteralPath $zip) -or (Get-Item $zip).Length -lt 1MB) {
            throw "Manager-owned NuGet seed is missing or unexpectedly small."
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $feed -Force
          $manifest = Join-Path $feed "manifest.json"
          if (!(Test-Path -LiteralPath $manifest)) {
            throw "Offline NuGet seed manifest is missing."
          }

          $metadata = Get-Content $manifest -Raw | ConvertFrom-Json
          foreach ($package in @($metadata.packages)) {
            $path = Join-Path $feed ([string]$package.name)
            if (!(Test-Path -LiteralPath $path)) {
              throw "Offline NuGet package is missing: $($package.name)"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$package.sha256).ToLowerInvariant()) {
              throw "Offline NuGet package digest mismatch: $($package.name)"
            }
          }

          foreach ($lock in @($metadata.locks)) {
            $path = Join-Path $feed ([string]$lock.asset)
            if (!(Test-Path -LiteralPath $path)) {
              throw "Offline NuGet lockfile is missing: $($lock.asset)"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$lock.sha256).ToLowerInvariant()) {
              throw "Offline NuGet lockfile digest mismatch: $($lock.asset)"
            }
          }

          Copy-Item (Join-Path $feed "packages.lock.json") "packages.lock.json" -Force
          Copy-Item (Join-Path $feed "tests-packages.lock.json") "tests/DlssNrManager.Tests/packages.lock.json" -Force

          Write-Host "Validated $(@($metadata.packages).Count) manager-owned NuGet packages and locked dependency graphs."

      - name: Validate self-contained tooling
        shell: pwsh
        run: |
          $paths = @(
            "tools/vendor-third-party.ps1",
            "tools/verify-self-contained.ps1",
            "tools/build-realesrgan.ps1",
            "tools/build-optiscaler.ps1",
            "tools/build-reshade.ps1",
            "tools/build-video2dlssnr.ps1",
            "tools/publish-video2dlssnr.ps1",
            "tools/publish-streamline-runtime.ps1",
            "tools/bootstrap-manager-runtime-assets.ps1",
            "tools/bootstrap-minecraft-runtime.ps1",
            "tools/refresh-upstream.ps1",
            "tools/refresh-minecraft-runtime-lock.ps1",
            "tools/generate-components-manifest.ps1"
          )

          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell syntax validation failed for $path"
            }
          }

          $lock = Get-Content "third_party/DEPENDENCIES.lock.json" -Raw | ConvertFrom-Json
          $all = @($lock.sources) + @($lock.local_only)

          $duplicateIds = $all | Group-Object id | Where-Object Count -gt 1
          if ($duplicateIds) { throw "Duplicate dependency ids: $($duplicateIds.Name -join ', ')" }

          $duplicatePaths = $all | Group-Object path | Where-Object Count -gt 1
          if ($duplicatePaths) { throw "Duplicate dependency paths: $($duplicatePaths.Name -join ', ')" }

          foreach ($source in $all) {
            if ("$($source.ref)" -notmatch "^[0-9a-fA-F]{40}$") {
              throw "Dependency '$($source.id)' is not pinned to an immutable commit SHA: $($source.ref)"
            }
          }

          $upstreams = Get-Content "third_party/UPSTREAMS.json" -Raw | ConvertFrom-Json
          $policyDuplicates = @($upstreams.sources) | Group-Object id | Where-Object Count -gt 1
          if ($policyDuplicates) { throw "Duplicate upstream policy ids: $($policyDuplicates.Name -join ', ')" }

          $knownIds = @($all.id)
          foreach ($policy in @($upstreams.sources)) {
            if ($knownIds -notcontains [string]$policy.id) {
              throw "Upstream policy '$($policy.id)' has no dependency lock entry."
            }
          }

          Write-Host "Vendor tooling syntax, dependency lock and upstream policies verified."

      - name: Enforce self-contained runtime/release audit
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-self-contained.ps1 -Strict -AllowLfsPointers
          if ($LASTEXITCODE -ne 0) { throw "Strict self-contained dependency audit failed." }

      - name: Restore from manager-owned NuGet feed only
        shell: pwsh
        run: |
          $feed = (Resolve-Path "build-local/nuget-offline").Path
          dotnet restore DlssNrManager.csproj --source $feed --no-cache --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Offline manager restore failed." }
          dotnet restore tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj --source $feed --no-cache --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Offline test restore failed." }

      - name: Run regression tests
        run: dotnet test tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Publish Windows x64 single-file
        run: dotnet publish DlssNrManager.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -warnaserror -o publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "publish/DlssNrManager.exe")) { throw "DlssNrManager.exe was not generated" }

      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class IconProbe { [DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string fileName, int iconIndex, IntPtr[] largeIcons, IntPtr[] smallIcons, uint iconCount); }'
          $exe = (Resolve-Path "publish/DlssNrManager.exe").Path
          $count = [IconProbe]::ExtractIconEx($exe, -1, $null, $null, 0)
          if ($count -lt 1) { throw "Published EXE contains no embedded icon resource" }
          Write-Host "Embedded icon groups: $count"

      - name: Verify exact Windows icon frames
        shell: pwsh
        run: |
          $path = "assets/branding/app.ico"
          if (!(Test-Path $path)) { throw "Generated app.ico is missing" }

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 6) { throw "Generated ICO is too small" }

          $count = [BitConverter]::ToUInt16($bytes, 4)
          $sizes = @()

          for ($i = 0; $i -lt $count; $i++) {
            $offset = 6 + ($i * 16)
            if ($offset + 15 -ge $bytes.Length) { throw "Malformed ICO directory entry" }

            $width = [int]$bytes[$offset]
            $height = [int]$bytes[$offset + 1]
            if ($width -eq 0) { $width = 256 }
            if ($height -eq 0) { $height = 256 }

            if ($width -ne $height) { throw "Non-square icon frame detected: $width x $height" }
            $sizes += $width
          }

          $required = @(16, 20, 24, 32, 40, 48, 64, 128, 256)
          foreach ($size in $required) {
            if ($sizes -notcontains $size) {
              throw "Missing exact icon frame: ${size}x${size}. Found: $($sizes -join ', ')"
            }
          }

          Write-Host "ICO frames verified: $($sizes -join ', ')"
