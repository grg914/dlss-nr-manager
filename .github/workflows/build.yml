name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DlssNrManager.csproj
      - name: Publish Windows x64 single-file
        run: dotnet publish DlssNrManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "publish/DlssNrManager.exe")) { throw "DlssNrManager.exe was not generated" }
      - uses: actions/upload-artifact@v4
        with:
          name: DlssNrManager-win-x64
          path: publish/DlssNrManager.exe
