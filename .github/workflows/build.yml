name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this repository without external actions
        shell: pwsh
        run: |
          $env:GIT_LFS_SKIP_SMUDGE = "1"
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"

          # Pull-request merge refs can be regenerated while a queued job starts.
          # Fetch the immutable PR head SHA for PR validation; use GITHUB_SHA for
          # push/manual runs where the event revision itself is stable.
          $expected = "$env:GITHUB_SHA"
          $pullRequestHead = "${{ github.event.pull_request.head.sha }}"
          if (-not [string]::IsNullOrWhiteSpace($pullRequestHead)) {
            $expected = $pullRequestHead
          }

          git fetch --no-tags --prune --depth=1 origin "$expected"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch ${{ github.repository }} at commit $expected." }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout workflow revision." }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Checkout mismatch. Expected $expected, got $actual."
          }

      - name: Require preinstalled .NET 8 toolchain
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          if (-not ($sdks | Where-Object { $_ -match '^8\.' })) {
            throw "The runner has no preinstalled .NET 8 SDK. Production CI must not download toolchains."
          }
          dotnet --info

      - name: Validate release dispatch helper syntax
        shell: bash
        run: bash -n ./tools/dispatch-release-if-needed.sh

      - name: Validate self-contained tooling
        shell: pwsh
        run: |
          $paths = @(
            "tools/vendor-third-party.ps1",
            "tools/verify-self-contained.ps1",
            "tools/build-realesrgan.ps1",
            "tools/build-optiscaler.ps1",
            "tools/build-reshade.ps1",
            "tools/build-video2dlssnr.ps1",
            "tools/publish-video2dlssnr.ps1",
            "tools/publish-streamline-runtime.ps1",
            "tools/publish-temurin25-runtime.ps1",
            "tools/bootstrap-manager-runtime-assets.ps1",
            "tools/bootstrap-minecraft-runtime.ps1",
            "tools/refresh-upstream.ps1",
            "tools/refresh-minecraft-runtime-lock.ps1",
            "tools/generate-components-manifest.ps1",
            "tools/verify-caustica-scandi-assets.ps1",
            "tools/verify-streamline-runtime-asset.ps1",
            "tools/download-runtime-seed.ps1",
            "tools/prepare-offline-dotnet.ps1",
            "tools/build-nuget-offline-seed.ps1",
            "tools/verify-repository-governance.ps1",
            "tools/generate-sbom.ps1",
            "tools/generate-release-provenance.ps1",
            "tools/create-application-package.ps1"
          )

          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell syntax validation failed for $path"
            }
          }

          $lock = Get-Content "third_party/DEPENDENCIES.lock.json" -Raw | ConvertFrom-Json
          $all = @($lock.sources) + @($lock.local_only)
          $duplicateIds = $all | Group-Object id | Where-Object Count -gt 1
          if ($duplicateIds) { throw "Duplicate dependency ids: $($duplicateIds.Name -join ', ')" }
          $duplicatePaths = $all | Group-Object path | Where-Object Count -gt 1
          if ($duplicatePaths) { throw "Duplicate dependency paths: $($duplicatePaths.Name -join ', ')" }

          foreach ($source in $all) {
            if ("$($source.ref)" -notmatch "^[0-9a-fA-F]{40}$") {
              throw "Dependency '$($source.id)' is not pinned to an immutable commit SHA: $($source.ref)"
            }
          }

          $upstreams = Get-Content "third_party/UPSTREAMS.json" -Raw | ConvertFrom-Json
          $policyDuplicates = @($upstreams.sources) | Group-Object id | Where-Object Count -gt 1
          if ($policyDuplicates) { throw "Duplicate upstream policy ids: $($policyDuplicates.Name -join ', ')" }
          $knownIds = @($all.id)
          foreach ($policy in @($upstreams.sources)) {
            if ($knownIds -notcontains [string]$policy.id) {
              throw "Upstream policy '$($policy.id)' has no dependency lock entry."
            }
          }

      - name: Validate repository governance
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-repository-governance.ps1
          if ($LASTEXITCODE -ne 0) { throw "Repository governance audit failed." }

      - name: Generate and validate SPDX SBOM
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\generate-sbom.ps1 -OutputPath build-local/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }
          Get-Content build-local/SBOM.spdx.json -Raw | ConvertFrom-Json | Out-Null

      - name: Enforce Minecraft native Vulkan/NGX policy
        shell: pwsh
        run: |
          & .\tools\verify-minecraft-native-ngx-path.ps1

      - name: Audit manager-owned Caustica and Scandi assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "DlssNrManager-Build"
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest"
          $assets = @($release.assets)
          $caustica = $assets |
            Where-Object {
              $_.name -match "(?i)^Caustica-RTX-Minecraft-26\.2-build-.*\.jar$" -and
              $_.name -notmatch "(?i)(sources|dev|javadoc)"
            } |
            Select-Object -First 1
          $spbr = $assets | Where-Object { $_.name -eq "SPBRScandi.zip" } | Select-Object -First 1

          if (-not $caustica) { throw "Latest stable manager release has no Caustica RTX Minecraft 26.2 JAR." }
          if (-not $spbr) { throw "Latest stable manager release has no SPBRScandi.zip." }

          New-Item -ItemType Directory -Path "asset-audit" -Force | Out-Null

          foreach ($asset in @($caustica, $spbr)) {
            if (-not ([string]$asset.digest).StartsWith("sha256:", [StringComparison]::OrdinalIgnoreCase)) {
              throw "Manager-owned asset '$($asset.name)' has no SHA-256 digest."
            }

            $destination = Join-Path "asset-audit" ([string]$asset.name)
            Invoke-WebRequest -Headers $headers -Uri ([string]$asset.browser_download_url) -OutFile $destination

            $expected = ([string]$asset.digest).Substring(7).ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Manager-owned asset '$($asset.name)' failed SHA-256 verification."
            }
          }

          $causticaPath = Join-Path "asset-audit" ([string]$caustica.name)
          $spbrPath = Join-Path "asset-audit" "SPBRScandi.zip"
          & .\tools\verify-caustica-scandi-assets.ps1 -CausticaJar $causticaPath -SpbrZip $spbrPath

      - name: Audit manager-owned NVIDIA Streamline runtime seed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path "runtime-audit" -Force | Out-Null
          gh release download runtime-seed-v1 --repo "${{ github.repository }}" --pattern "streamline-runtime-v2.14.1-win-x64.zip" --dir "runtime-audit" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to download manager-owned Streamline runtime seed." }

          $zip = Join-Path "runtime-audit" "streamline-runtime-v2.14.1-win-x64.zip"
          $release = gh api "repos/${{ github.repository }}/releases/tags/runtime-seed-v1" | ConvertFrom-Json
          $asset = @($release.assets) | Where-Object { $_.name -eq "streamline-runtime-v2.14.1-win-x64.zip" } | Select-Object -First 1
          if (-not $asset -or -not ([string]$asset.digest).StartsWith("sha256:", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Manager-owned Streamline runtime seed has no GitHub SHA-256 digest."
          }

          $expected = ([string]$asset.digest).Substring(7).ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Streamline runtime seed ZIP failed SHA-256 verification." }

          & .\tools\verify-streamline-runtime-asset.ps1 -ZipPath $zip

      - name: Enforce zero-upstream production audit
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-self-contained.ps1 -Strict -AllowLfsPointers
          if ($LASTEXITCODE -ne 0) { throw "Strict self-contained dependency audit failed." }

      - name: Prepare manager-owned offline NuGet feed
        id: offline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\prepare-offline-dotnet.ps1 -Repository "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Offline .NET dependency preparation failed." }

      - name: Restore strictly from manager-owned feed
        shell: pwsh
        run: |
          $config = "${{ steps.offline.outputs.config }}"
          $packages = "${{ steps.offline.outputs.packages }}"
          dotnet restore DlssNrManager.csproj --configfile "$config" --packages "$packages"
          if ($LASTEXITCODE -ne 0) { throw "Application offline restore failed." }
          dotnet restore tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj --configfile "$config" --packages "$packages"
          if ($LASTEXITCODE -ne 0) { throw "Tests offline restore failed." }

      - name: Run regression tests
        run: dotnet test tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Publish Windows x64 single-file
        run: dotnet publish DlssNrManager.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -warnaserror -o publish

      - name: Verify executable and icon
        shell: pwsh
        run: |
          if (!(Test-Path "publish/DlssNrManager.exe")) { throw "DlssNrManager.exe was not generated" }

          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class IconProbe { [DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string fileName, int iconIndex, IntPtr[] largeIcons, IntPtr[] smallIcons, uint iconCount); }'
          $exe = (Resolve-Path "publish/DlssNrManager.exe").Path
          $count = [IconProbe]::ExtractIconEx($exe, -1, $null, $null, 0)
          if ($count -lt 1) { throw "Published EXE contains no embedded icon resource" }

          $path = "assets/branding/app.ico"
          if (!(Test-Path $path)) { throw "Generated app.ico is missing" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          $frameCount = [BitConverter]::ToUInt16($bytes, 4)
          $sizes = @()
          for ($i = 0; $i -lt $frameCount; $i++) {
            $offset = 6 + ($i * 16)
            $width = [int]$bytes[$offset]
            $height = [int]$bytes[$offset + 1]
            if ($width -eq 0) { $width = 256 }
            if ($height -eq 0) { $height = 256 }
            if ($width -ne $height) { throw "Non-square icon frame detected: $width x $height" }
            $sizes += $width
          }
          foreach ($size in @(16, 20, 24, 32, 40, 48, 64, 128, 256)) {
            if ($sizes -notcontains $size) { throw "Missing exact icon frame: ${size}x${size}." }
          }
          Write-Host "Production build validated without external actions or package feeds."

      - name: Verify deterministic application packaging
        shell: pwsh
        run: |
          $createdAt = (git show -s --format=%cI HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($createdAt)) { throw "Unable to resolve source commit timestamp." }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\create-application-package.ps1 -ExecutablePath "publish/DlssNrManager.exe" -OutputPath "build-local/package-a.zip" -TimestampUtc "$createdAt"
          if ($LASTEXITCODE -ne 0) { throw "First deterministic package build failed." }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\create-application-package.ps1 -ExecutablePath "publish/DlssNrManager.exe" -OutputPath "build-local/package-b.zip" -TimestampUtc "$createdAt"
          if ($LASTEXITCODE -ne 0) { throw "Second deterministic package build failed." }

          $a = (Get-FileHash -LiteralPath "build-local/package-a.zip" -Algorithm SHA256).Hash
          $b = (Get-FileHash -LiteralPath "build-local/package-b.zip" -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "Application ZIP is not reproducible. First SHA-256: $a; second SHA-256: $b" }
          Write-Host "Deterministic application packaging verified: $($a.ToLowerInvariant())"
