name: Runtime Seed Writer Safety Tests

on:
  pull_request:
    paths:
      - .github/workflows/runtime-refresh.yml
      - .github/workflows/nuget-seed.yml
      - .github/workflows/runtime-seed-writer-safety.yml
      - tools/publish-immutable-nuget-seed.ps1
      - tests/test_immutable_nuget_seed.ps1
      - tools/publish-versioned-runtime-seed.ps1
      - tools/publish-append-only-runtime-seed.ps1
      - tools/publish-vlc-runtime.ps1
      - tools/publish-temurin25-runtime.ps1
      - tests/test_append_only_runtime_seed.ps1
      - tests/test_legacy_ps51_seed_zip.ps1
      - tests/test_versioned_runtime_seed.ps1
      - tests/test_runtime_seed_writer_policy.py
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-refresh.yml
      - .github/workflows/nuget-seed.yml
      - .github/workflows/runtime-seed-writer-safety.yml
      - tools/publish-immutable-nuget-seed.ps1
      - tests/test_immutable_nuget_seed.ps1
      - tools/publish-versioned-runtime-seed.ps1
      - tools/publish-append-only-runtime-seed.ps1
      - tools/publish-vlc-runtime.ps1
      - tools/publish-temurin25-runtime.ps1
      - tests/test_append_only_runtime_seed.ps1
      - tests/test_legacy_ps51_seed_zip.ps1
      - tests/test_versioned_runtime_seed.ps1
      - tests/test_runtime_seed_writer_policy.py

permissions:
  contents: read

jobs:
  verify-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Execute source-level producer and license guard tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_runtime_seed_writer_policy.py' -v
      - name: Exercise mocked append-only NuGet publication
        shell: pwsh
        run: ./tests/test_immutable_nuget_seed.ps1
      - name: Exercise verified versioned package publication
        shell: pwsh
        run: ./tests/test_versioned_runtime_seed.ps1
      - name: Exercise append-only VLC Temurin and Real-ESRGAN seed publishing
        shell: pwsh
        run: ./tests/test_append_only_runtime_seed.ps1

  verify-windows-powershell-51:
    name: Verify Windows PowerShell 5.1 ZIP publisher
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Exercise ZIP validation in a fresh Desktop PowerShell process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'winps-seed-zip-smoke'
          $directory = Join-Path $work 'fixture'
          New-Item -Path $directory -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $directory 'bin.exe') -Value 'synthetic-not-proprietary'
          $zip = Join-Path $work 'temurin-25-jre-win-x64.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($directory, $zip)
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_legacy_ps51_seed_zip.ps1 -ZipPath $zip -PublisherPath .\tools\publish-append-only-runtime-seed.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate OpenMP-free Real-ESRGAN scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($script in @('.\tools\build-realesrgan.ps1', '.\tools\audit-realesrgan-package-openmp.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path,
              [ref]$tokens,
              [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "Windows PowerShell 5.1 script syntax invalid: $script"
            }
          }
