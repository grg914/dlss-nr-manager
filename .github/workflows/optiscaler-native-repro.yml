name: OptiScaler Native Reproducibility Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/verify-optiscaler-native-repro.ps1'
      - 'tools/build-optiscaler.ps1'
      - '.github/workflows/optiscaler-native-repro.yml'

permissions:
  contents: read

jobs:
  native-repro:
    name: Compare two native OptiScaler rebuilds
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Audit identical vendored inputs across two clean rebuilds
        shell: powershell
        run: |
          .\tools\verify-optiscaler-native-repro.ps1 -OutputDirectory build-local/optiscaler-repro
