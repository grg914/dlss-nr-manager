name: Streamline Immutable Seed Safety

on:
  pull_request:
    paths:
      - 'tools/publish-streamline-runtime.ps1'
      - 'tools/create-deterministic-flat-zip.ps1'
      - 'tools/publish-append-only-release-zip.ps1'
      - 'tools/verify-streamline-runtime-asset.ps1'
      - 'tests/test_streamline_immutable_packaging.ps1'
      - '.github/workflows/streamline-seed-safety.yml'
  push:
    branches: [main]
    paths:
      - 'tools/publish-streamline-runtime.ps1'
      - 'tools/create-deterministic-flat-zip.ps1'
      - 'tools/publish-append-only-release-zip.ps1'
      - 'tools/verify-streamline-runtime-asset.ps1'
      - 'tests/test_streamline_immutable_packaging.ps1'
      - '.github/workflows/streamline-seed-safety.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Streamline immutable packaging
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          lfs: false
      - name: Parse PowerShell implementation and tests
        shell: pwsh
        run: |
          $paths = @(
            'tools/publish-streamline-runtime.ps1',
            'tools/create-deterministic-flat-zip.ps1',
            'tools/publish-append-only-release-zip.ps1',
            'tools/verify-streamline-runtime-asset.ps1',
            'tests/test_streamline_immutable_packaging.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path : $($errors[0].Message)" }
          }
      - name: Rebuild synthetic Streamline archive twice and simulate immutable upload
        shell: pwsh
        run: ./tests/test_streamline_immutable_packaging.ps1
