name: Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'DlssNrManager.csproj'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "DlssNrManager.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version is missing."
          }

          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Release tag '${{ github.ref_name }}' does not match project version '$tag'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore DlssNrManager.csproj
          dotnet restore tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj

      - name: Run regression tests
        run: dotnet test tests/DlssNrManager.Tests/DlssNrManager.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Publish
        run: dotnet publish DlssNrManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -warnaserror -o publish

      - name: Verify published application identity
        shell: pwsh
        run: |
          if (!(Test-Path "publish/DlssNrManager.exe")) {
            throw "DlssNrManager.exe was not generated."
          }

          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path "publish/DlssNrManager.exe")).FileVersion

          if (-not $version.StartsWith("${{ steps.version.outputs.version }}")) {
            throw "Published EXE version '$version' does not match release version '${{ steps.version.outputs.version }}'."
          }

          Write-Host "Published EXE version verified: $version"

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path publish/DlssNrManager.exe -DestinationPath DlssNrManager-win-x64.zip -Force

      - name: Bundle Caustica RTX from monorepo or manager release
        id: caustica
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $local = Get-ChildItem "Caustica-RTX/build/libs" -Filter "*.jar" -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "(?i)caustica" -and
              $_.Name -notmatch "(?i)(sources|dev|javadoc)"
            } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($local) {
            $destination = Join-Path "release-assets" $local.Name
            Copy-Item $local.FullName $destination -Force
            "asset=$($local.Name)" >> $env:GITHUB_OUTPUT
            Write-Host "Bundled local monorepo Caustica build: $($local.Name)"
            exit 0
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "DlssNrManager-Release"
          }

          # Fallback remains inside this repository only. This avoids any
          # production dependency on the legacy standalone Caustica repository.
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50"

          $asset = $releases |
            Where-Object { -not $_.draft } |
            ForEach-Object { $_.assets } |
            Where-Object {
              $_.name -match "(?i)^Caustica-RTX-Minecraft-26\.2-build-.*\.jar$" -and
              $_.name -notmatch "(?i)(sources|dev|javadoc)"
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "No local or previously bundled Caustica RTX Minecraft 26.2 JAR is available in ${{ github.repository }}."
          }

          $destination = Join-Path "release-assets" $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $destination

          if ($asset.digest -and $asset.digest.StartsWith("sha256:")) {
            $expected = $asset.digest.Substring(7)
            $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "Caustica SHA-256 mismatch. Expected $expected, got $actual."
            }
          }

          "asset=$($asset.name)" >> $env:GITHUB_OUTPUT
          Write-Host "Reused Caustica asset from DLSS NR Manager release history: $($asset.name)"

      - name: Reuse validated SPBRScandi release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $target = Join-Path "release-assets" "SPBRScandi.zip"
          if (!(Test-Path $target)) {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "User-Agent" = "DlssNrManager-Release"
            }
            $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/grg914/dlss-nr-manager/releases?per_page=20"
            $asset = $null
            foreach ($release in $releases) {
              $candidate = $release.assets | Where-Object { $_.name -eq "SPBRScandi.zip" } | Select-Object -First 1
              if ($candidate) { $asset = $candidate; break }
            }
            if (-not $asset) {
              throw "No previously published SPBRScandi.zip asset was found."
            }
            Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $target
          }

      - name: Validate optional Scandi release assets
        shell: pwsh
        run: |
          # Scandi release assets are optional and must only be placed in
          # release-assets/ after redistribution rights have been verified.
          # The texture fingerprint below is the validated SPBR-based Scandi-safe pack.
          # It keeps SPBR terrain/PBR assets and adds the verified Scandi sky/UI/effects set.
          $assets = @(
            @{ Name = "SPBRScandi.zip"; Sha256 = "1BB19E99208E8826EABF7775FA06353E78A6EA449D43F12CD9D26EACF5BD9177" },
            @{ Name = "ScandiShaderV2.zip";  Sha256 = "C2C1E9C531342CC314368146A963FC2FD7D4A414F67C971558FC5ECA89D329F9" }
          )

          foreach ($asset in $assets) {
            $path = Join-Path "release-assets" $asset.Name
            if (!(Test-Path $path)) {
              Write-Host "Optional asset not present in repository checkout: $($asset.Name)"
              continue
            }

            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $asset.Sha256) {
              throw "SHA-256 mismatch for $($asset.Name). Expected $($asset.Sha256), got $actual."
            }

            Write-Host "Validated $($asset.Name) • SHA-256 $actual"
          }

      - name: Generate final SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "publish/DlssNrManager.exe",
            "DlssNrManager-win-x64.zip",
            (Join-Path "release-assets" "${{ steps.caustica.outputs.asset }}")
          )

          foreach ($optional in @(
            "release-assets/SPBRScandi.zip",
            "release-assets/ScandiShaderV2.zip"
          )) {
            if (Test-Path $optional) {
              $files += $optional
            }
          }

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }

          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "SHA256SUMS.txt"),
            $lines,
            [System.Text.UTF8Encoding]::new($false))

          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: DlssNrManager-win-x64
          path: |
            publish/DlssNrManager.exe
            DlssNrManager-win-x64.zip
            SHA256SUMS.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: DLSS NR Manager v${{ steps.version.outputs.version }}
          files: |
            publish/DlssNrManager.exe
            DlssNrManager-win-x64.zip
            SHA256SUMS.txt
            release-assets/SPBRScandi.zip
            release-assets/ScandiShaderV2.zip
            release-assets/Caustica-RTX-Minecraft-26.2-build-*.jar
          fail_on_unmatched_files: false
          generate_release_notes: true
          make_latest: true
