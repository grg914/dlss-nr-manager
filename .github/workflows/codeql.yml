name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          lfs: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: csharp
          queries: security-extended

      - name: Require preinstalled .NET 8
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          if (-not ($sdks | Where-Object { $_ -match '^8\.' })) {
            throw "The runner has no preinstalled .NET 8 SDK."
          }

      - name: Prepare manager-owned offline NuGet feed
        id: offline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\prepare-offline-dotnet.ps1 -Repository "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Offline .NET dependency preparation failed." }

      - name: Restore from manager-owned feed
        shell: pwsh
        run: |
          $config = "${{ steps.offline.outputs.config }}"
          $packages = "${{ steps.offline.outputs.packages }}"
          dotnet restore DlssNrManager.csproj --configfile "$config" --packages "$packages"
          if ($LASTEXITCODE -ne 0) { throw "Application offline restore failed." }

      - name: Build application for CodeQL
        shell: pwsh
        run: |
          $packages = "${{ steps.offline.outputs.packages }}"
          dotnet build DlssNrManager.csproj -c Release --no-restore --packages "$packages"
          if ($LASTEXITCODE -ne 0) { throw "CodeQL build failed." }

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:csharp"
