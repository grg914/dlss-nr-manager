name: Feature request
description: Suggest a focused improvement
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: New dependencies / downloads
      description: List any new runtime, model, SDK, service, network host, or binary this would require.
  - type: textarea
    id: licensing
    attributes:
      label: License / redistribution considerations
      description: If this depends on third-party code, models, or assets, include their licenses if known.
